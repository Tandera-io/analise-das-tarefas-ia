[tool.poetry]
name = "analise-das-tarefas-ia"
version = "0.1.0"
description = "AI-powered task analysis service for Tandera transcription app"
authors = ["Devin AI <devin-ai-integration[bot]@users.noreply.github.com>"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.104.1"
uvicorn = "^0.24.0"
anthropic = "^0.45.0"
supabase = "^2.8.1"
python-dotenv = "^1.0.0"
httpx = "^0.27.2"
pydantic = "^2.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
